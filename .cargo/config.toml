[build]
# softfloat: never use the FP/SIMD registers (the FPU is off at EL1, and
# irq_entry doesn't save them), like -mgeneral-regs-only in C
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
# Cargo appends the ELF path to the runner, so -kernel goes last.
# In another shell: telnet localhost 5678
# Quit qemu: (qemu) quit
# Quit telnet: Ctrl + ] -> telnet> quit
runner = ["qemu-system-aarch64", "-M", "virt", "-cpu", "cortex-a53", "-nographic", "-serial", "telnet:localhost:5678,server=on,wait=off", "-kernel"]

[alias]
qemu = ["run", "--release"]

# Debug build; halts and waits for GDB on localhost:1234
# In another shell:
#   RUST_GDB=gdb-multiarch rust-gdb -q ./target/aarch64-unknown-none-softfloat/debug/baremetal
#   (gdb) target remote localhost:1234
#   (gdb) break main_app
#   (gdb) continue
# In another shell: telnet localhost 5678
qemu-debug = ["run", "--config", "target.aarch64-unknown-none-softfloat.runner=['qemu-system-aarch64','-M','virt','-cpu','cortex-a53','-nographic','-serial','telnet:localhost:5678,server=on,wait=off','-S','-gdb','tcp:localhost:1234','-kernel']"]
